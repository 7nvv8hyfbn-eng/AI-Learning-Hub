name: ai-learning-hub

x-server-build: &server-build
  context: ../..
  dockerfile: server/Dockerfile

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  migrate:
    image: ai-learning-hub-server:local
    build: *server-build
    restart: "no"
    env_file: .env
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap:
    image: ai-learning-hub-server:local
    build: *server-build
    restart: "no"
    env_file: .env
    command: ["npm", "run", "bootstrap"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  seed-demo:
    profiles: ["demo"]
    image: ai-learning-hub-server:local
    build: *server-build
    restart: "no"
    env_file: .env
    environment:
      LOAD_DEMO_DATA: ${LOAD_DEMO_DATA:-false}
    command: ["npm", "run", "prisma:seed"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  server:
    init: true
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 128
    stop_grace_period: 30s
    image: ai-learning-hub-server:local
    build: *server-build
    restart: unless-stopped
    env_file: .env
    environment:
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-local}
      PORT: 3000
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      STORAGE_LOCAL_PATH: /workspace/server/var/uploads
    volumes:
      - uploads_data:/workspace/server/var/uploads
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  student-web:
    image: ai-learning-hub-student:local
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        VITE_DATA_MODE: api
        VITE_API_BASE_URL: /api/v1
        VITE_ADMIN_PREVIEW_ORIGINS: ${ADMIN_PREVIEW_ORIGINS:-}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${STUDENT_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -qx ok"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  admin-web:
    image: ai-learning-hub-admin:local
    build:
      context: ../..
      dockerfile: admin-web/Dockerfile
      args:
        VITE_STUDENT_PREVIEW_URL: ${STUDENT_PREVIEW_URL:-}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-8081}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -qx ok"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  uploads_data:
