name: ai-learning-hub

x-logging: &bounded-logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

x-server-build: &server-build
  context: ../..
  dockerfile: server/Dockerfile

services:
  preflight:
    image: ai-learning-hub-server:${APP_IMAGE_TAG:-local}
    build: *server-build
    restart: "no"
    env_file: ${ENV_FILE:-.env}
    command: ["node", "dist/production-preflight.js"]

  postgres:
    logging: *bounded-logging
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 128
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    networks: [data]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  migrate:
    image: ai-learning-hub-server:${APP_IMAGE_TAG:-local}
    build: *server-build
    restart: "no"
    env_file: ${ENV_FILE:-.env}
    networks: [data]
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      preflight:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  bootstrap:
    image: ai-learning-hub-server:${APP_IMAGE_TAG:-local}
    build: *server-build
    restart: "no"
    env_file: ${ENV_FILE:-.env}
    networks: [edge, data]
    environment:
      STORAGE_LOCAL_PATH: /workspace/server/var/uploads
    volumes:
      - uploads_data:/workspace/server/var/uploads
    command: ["npm", "run", "bootstrap"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  content-sync:
    image: ai-learning-hub-server:${APP_IMAGE_TAG:-local}
    build: *server-build
    restart: "no"
    env_file: ${ENV_FILE:-.env}
    networks: [edge, data]
    environment:
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-local}
      STORAGE_LOCAL_PATH: /workspace/server/var/uploads
    volumes:
      - uploads_data:/workspace/server/var/uploads
    command: ["npm", "run", "content:sync"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  server:
    logging: *bounded-logging
    init: true
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 128
    stop_grace_period: 30s
    image: ai-learning-hub-server:${APP_IMAGE_TAG:-local}
    build: *server-build
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    networks: [edge, data]
    environment:
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-local}
      PORT: 3000
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.80.10/32,172.30.80.11/32}
      STORAGE_LOCAL_PATH: /workspace/server/var/uploads
    volumes:
      - uploads_data:/workspace/server/var/uploads
    depends_on:
      content-sync:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  student-web:
    logging: *bounded-logging
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    image: ai-learning-hub-student:${APP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        VITE_DATA_MODE: api
        VITE_API_BASE_URL: /api/v1
        VITE_ADMIN_PREVIEW_ORIGINS: ${ADMIN_WEB_URL:-}
    restart: unless-stopped
    environment:
      EXTERNAL_PROXY_CIDRS: ${EXTERNAL_PROXY_CIDRS:-}
      ADMIN_NETWORK_CIDRS: ${ADMIN_NETWORK_CIDRS:-127.0.0.1/32,::1/128}
      ADMIN_WEB_URL: ${ADMIN_WEB_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
    networks:
      edge:
        ipv4_address: ${STUDENT_PROXY_IP:-172.30.80.10}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${STUDENT_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -qx ok"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  admin-web:
    logging: *bounded-logging
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    image: ai-learning-hub-admin:${APP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: admin-web/Dockerfile
      args:
        VITE_STUDENT_PREVIEW_URL: ${FRONTEND_URL:-}
    restart: unless-stopped
    environment:
      EXTERNAL_PROXY_CIDRS: ${EXTERNAL_PROXY_CIDRS:-}
      ADMIN_NETWORK_CIDRS: ${ADMIN_NETWORK_CIDRS:-127.0.0.1/32,::1/128}
      ADMIN_WEB_URL: ${ADMIN_WEB_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
    networks:
      edge:
        ipv4_address: ${ADMIN_PROXY_IP:-172.30.80.11}
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-8081}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -qx ok"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  uploads_data:

networks:
  edge:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.80.0/24}
  data:
    internal: true
