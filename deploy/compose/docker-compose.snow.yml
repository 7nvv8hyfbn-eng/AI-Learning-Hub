# 与 docker-compose.yml 合用；旧学生镜像单独固定，新学生端/后台/API 使用 APP_IMAGE_TAG。
services:
  student-web:
    image: ai-learning-hub-student:${LEGACY_STUDENT_IMAGE_TAG:?必须固定8080旧学生端镜像}
    build: !reset null
    volumes:
      - ./nginx-student-legacy.conf:/etc/nginx/conf.d/default.conf:ro

  student-snow:
    extends:
      file: docker-compose.yml
      service: student-web
    image: ai-learning-hub-student:${APP_IMAGE_TAG:?必须固定小雪版镜像}
    networks:
      edge:
        ipv4_address: ${SECONDARY_STUDENT_PROXY_IP:-172.30.80.12}
    ports: !override
      - "${BIND_ADDRESS:-127.0.0.1}:${SNOW_STUDENT_PORT:-7070}:80"
