# 学生端静态站与 API 反向代理
server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log security_safe;
    include /etc/nginx/snippets/security-headers.conf;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /version.json {
        try_files $uri =404;
    }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 固定 v0.1.15 入口不开放小雪 API；静态文件仍使用原镜像。
    location ~* ^/api/v1/assistant(?:/|$) { return 404; }

    location /api/ {
        client_max_body_size 1025m;
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header Forwarded "";
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # 学生入口不能转发后台请求，包括管理员登录和 Swagger。
    location ~* ^/api/(?:v1/(?:admin(?:/|$)|admin-auth(?:/|$))|docs) { return 403; }

    location = /index.html {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
